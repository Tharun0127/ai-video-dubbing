<svg xmlns="http://www.w3.org/2000/svg" width="880" height="318" viewBox="0 0 880 318" role="img"><style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.ttl{font-size:15px;font-weight:600;fill:#1f2328}
.sub{font-size:11px;fill:#656d76}
.lbl{font-size:12px;fill:#1f2328}
.val{font-size:11px;font-weight:600;fill:#1f2328}
.note{font-size:11px;fill:#656d76}
.ax{stroke:#d0d7de;stroke-width:1}
.grid{stroke:#d0d7de;stroke-width:1;stroke-dasharray:2 3;opacity:.7}
@media (prefers-color-scheme:dark){
.ttl,.lbl,.val{fill:#e6edf3}
.sub,.note{fill:#9198a1}
.ax,.grid{stroke:#3d444d}
}
</style><text class="ttl" x="16" y="24">Identical request, three different durations</text><text class="sub" x="16" y="42">output/tts_variance_probe.json - same text, pace 1.0, same speaker, fresh cache on every call</text><rect x="64" y="102.0" width="626" height="11.0" fill="#10b981" opacity="0.16"/><line x1="64" y1="107.5" x2="690" y2="107.5" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5 4"/><text class="sub" x="700" y="111.5">mean 6.127 s</text><text class="sub" x="700" y="98.0">the ±5% convergence band</text><rect x="131.3" y="99.4" width="74" height="118.6" rx="3" fill="#ef4444"/><text class="val" x="168.3" y="91.4" text-anchor="middle">6.580 s</text><text class="sub" x="168.3" y="236.0" text-anchor="middle">call 1</text><rect x="340.0" y="123.2" width="74" height="94.8" rx="3" fill="#ef4444"/><text class="val" x="377.0" y="115.2" text-anchor="middle">5.260 s</text><text class="sub" x="377.0" y="236.0" text-anchor="middle">call 2</text><rect x="548.7" y="100.1" width="74" height="117.9" rx="3" fill="#ef4444"/><text class="val" x="585.7" y="92.1" text-anchor="middle">6.540 s</text><text class="sub" x="585.7" y="236.0" text-anchor="middle">call 3</text><line class="ax" x1="64" y1="218" x2="690" y2="218"/><text class="note" x="16" y="266">Spread 1.32 s = 21.5452% of the mean (σ = 0.751 s) - over 4x the convergence band. A pace measured on one call cannot be assumed to hold on the next.</text><text class="note" x="16" y="284">The pipeline is unaffected because it ships the exact audio it measured: caching a pace per phrase and re-requesting would have been unsound.</text><text class="note" x="16" y="302">Reproduce with: make variance-probe</text></svg>
