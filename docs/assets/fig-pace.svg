<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" role="img"><style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.ttl{font-size:15px;font-weight:600;fill:#1f2328}
.sub{font-size:11px;fill:#656d76}
.lbl{font-size:12px;fill:#1f2328}
.val{font-size:11px;font-weight:600;fill:#1f2328}
.note{font-size:11px;fill:#656d76}
.ax{stroke:#d0d7de;stroke-width:1}
.grid{stroke:#d0d7de;stroke-width:1;stroke-dasharray:2 3;opacity:.7}
@media (prefers-color-scheme:dark){
.ttl,.lbl,.val{fill:#e6edf3}
.sub,.note{fill:#9198a1}
.ax,.grid{stroke:#3d444d}
}
</style><text class="ttl" x="16" y="24">Higher pace = shorter audio, and the response saturates past 1.25</text><text class="sub" x="16" y="42">output/m4_pace_probe.json - one Hindi sentence, six real calls to bulbul:v3</text><rect x="248.8" y="74" width="211.2" height="180" fill="#10b981" opacity="0.10"/><text class="sub" x="354.4" y="64" text-anchor="middle">clamp used by the pipeline: 0.85 - 1.25</text><line class="grid" x1="64" y1="254.0" x2="856" y2="254.0"/><text class="sub" x="56" y="258.0" text-anchor="end">0.0s</text><line class="grid" x1="64" y1="209.0" x2="856" y2="209.0"/><text class="sub" x="56" y="213.0" text-anchor="end">1.1s</text><line class="grid" x1="64" y1="164.0" x2="856" y2="164.0"/><text class="sub" x="56" y="168.0" text-anchor="end">2.3s</text><line class="grid" x1="64" y1="119.0" x2="856" y2="119.0"/><text class="sub" x="56" y="123.0" text-anchor="end">3.4s</text><line class="grid" x1="64" y1="74.0" x2="856" y2="74.0"/><text class="sub" x="56" y="78.0" text-anchor="end">4.6s</text><line class="ax" x1="64" y1="74" x2="64" y2="254"/><line class="ax" x1="64" y1="254" x2="856" y2="254"/><polyline points="64.0,74.0 248.8,162.0 328.0,178.1 460.0,200.5 592.0,202.6 856.0,209.1" fill="none" stroke="#3b82f6" stroke-width="2.5"/><circle cx="64.0" cy="74.0" r="5" fill="#8b949e"/><text class="val" x="64.0" y="62.0" text-anchor="start">4.60s</text><text class="sub" x="64.0" y="272.0" text-anchor="middle">pace 0.5</text><circle cx="248.8" cy="162.0" r="5" fill="#3b82f6"/><text class="val" x="248.8" y="150.0" text-anchor="middle">2.35s</text><text class="sub" x="248.8" y="272.0" text-anchor="middle">pace 0.85</text><circle cx="328.0" cy="178.1" r="5" fill="#3b82f6"/><text class="val" x="328.0" y="166.1" text-anchor="middle">1.94s</text><text class="sub" x="328.0" y="272.0" text-anchor="middle">pace 1.0</text><circle cx="460.0" cy="200.5" r="5" fill="#3b82f6"/><text class="val" x="460.0" y="188.5" text-anchor="middle">1.37s</text><text class="sub" x="460.0" y="272.0" text-anchor="middle">pace 1.25</text><circle cx="592.0" cy="202.6" r="5" fill="#8b949e"/><text class="val" x="592.0" y="190.6" text-anchor="middle">1.31s</text><text class="sub" x="592.0" y="272.0" text-anchor="middle">pace 1.5</text><circle cx="856.0" cy="209.1" r="5" fill="#8b949e"/><text class="val" x="856.0" y="197.1" text-anchor="end">1.15s</text><text class="sub" x="856.0" y="272.0" text-anchor="middle">pace 2.0</text><text class="note" x="16" y="296">Elasticity inside the clamp: -1.57 to -1.18 - the knob does real work. Above 1.25 it collapses to -0.22 to -0.47.</text><text class="note" x="16" y="314">So the extra range the API allows buys almost no duration, at the cost of speech that stops sounding human. That is why the clamp is where it is.</text></svg>
